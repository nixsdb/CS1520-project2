{% extends "base.html" %}
{% block content %}
<h2>Customer dashboard</h2>
<h3>Request an event</h3>
<form method="post" action="{{ url_for('request_event') }}">
    <label for="date">Event date</label>
    <input id="date" name="date" type="date" required>
    <button type="submit">Request event</button>
</form>

<h3>Your requested events</h3>
{% if events %}
    <ul>
        {% for event in events %}
            <li>
                {{ event.date }}
                <form class="inline" method="post" action="{{ url_for('cancel_event', event_id=event.id) }}">
                    <button type="submit">Cancel event</button>
                </form>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>You have not requested any events!</p>
{% endif %}
{% endblock %}
